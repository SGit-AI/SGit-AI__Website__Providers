- id: openrouter-402
  state: verified
  date: 3 Sep 2026
  group: The argument
  claim: "At $4.79 used against a $5.00 provisioned limit, OpenRouter refused every audio request — `402`, *this request requires at least $0.50 in balance for audio output*, `limit_source: openrouter_key_limit`. **The bound worked**, which is the only evidence in this family that any of this is enforceable in practice rather than in a diagram."
  source: "The render log of two blocked re-renders, 3 September 2026"

- id: no-per-key-spend-limit
  state: docs
  date: 5 Sep 2026
  group: The argument
  claim: "ElevenLabs keys are **scoped, not bounded**: a key can be restricted to endpoints, and there is no per-key spend limit for text to speech. That asymmetry with OpenRouter is why the comparison table earns its place rather than being a feature grid."
  source: "The ElevenLabs site's own report, §5"

